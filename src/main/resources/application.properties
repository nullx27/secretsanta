spring.application.name=secretsanta

spring.h2.console.enabled=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.datasource.url=jdbc:h2:${DATABASE_FILE:mem:testdb}
spring.jpa.hibernate.ddl-auto=update

# Discord OAuth2 configuration
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.discord.scope=identify,email,guilds
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Optional: comma-separated list of Discord user IDs who are admins
app.admin.discord-ids=${ADMIN_DISCORD_IDS}

# JWT configuration
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me}
app.jwt.expiration-minutes=480
app.jwt.cookie-name=AUTH_TOKEN
